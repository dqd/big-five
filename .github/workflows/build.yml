name: build
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          pip install -r requirements.txt
      - name: Check migrations and translations
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py compilemessages
      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report -m
      - name: Update coverage badge
        run: |
          pip install "genbadge[coverage]"
          coverage xml
          genbadge coverage --input-file coverage.xml --output-file coverage.svg
      - name: Check whether the badge changed
        uses: tj-actions/verify-changed-files@v20
        id: badge
        with:
          files: coverage.svg
      - name: Commit the badge
        if: steps.badge.outputs.files_changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage.svg
          git commit -m "Updated coverage.svg"
          git push

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check
