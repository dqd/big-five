[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["bigfive/b5/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# Typographic quotes and dashes are used on purpose in the texts of the website.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["bigfive"]

[tool.coverage.run]
source = ["bigfive"]
omit = ["bigfive/b5/migrations/*", "bigfive/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
